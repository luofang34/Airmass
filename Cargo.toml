[package]
name = "airmass"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Source-neutral meteorological state for aviation applications"
license = "MIT"

[workspace]
members = [
    ".",
    "crates/airmass-aero-link",
    "crates/airmass-core",
    "crates/airmass-geojson",
]
resolver = "3"

[workspace.dependencies]
aero-link = { path = "../aero-link", default-features = false }
airmass-core = { version = "0.1.0", path = "crates/airmass-core", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0"
thiserror = { version = "2.0", default-features = false }

[workspace.lints.rust]
let_underscore_drop = "forbid"
missing_docs = "deny"
unsafe_code = "forbid"
unused_must_use = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "forbid"
disallowed_types = "forbid"
exit = "forbid"
expect_used = "forbid"
get_unwrap = "forbid"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
mem_forget = "forbid"
panic = "forbid"
print_stderr = "forbid"
print_stdout = "forbid"
todo = "forbid"
too_many_lines = "deny"
unimplemented = "forbid"
unreachable = "forbid"
unwrap_used = "forbid"

[lib]
name = "airmass"
path = "src/lib.rs"

[features]
default = []
std = ["airmass-core/std"]

[dependencies]
airmass-core = { workspace = true }

[lints]
workspace = true
