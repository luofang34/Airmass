[package]
name = "airmass"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Portable meteorological state for aviation applications"
license = "MIT"

[workspace]
members = ["."]
resolver = "3"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
disallowed_types = "deny"
expect_used = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
panic = "deny"
unwrap_used = "deny"

[lib]
name = "airmass"
path = "src/lib.rs"

[features]
default = []
std = ["aero-link/std"]

[dependencies]
aero-link = { path = "../aero-link", default-features = false }

[lints]
workspace = true
